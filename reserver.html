/* =========================================================================
   LOOKAHEAD — Feuille de style globale (Version épurée Booking)
   ========================================================================= */

:root {
  --bg: #ffffff;
  --soft: #fafafb;
  --ink: #0a0a0a;
  --body: #44464f;
  --body2: #5a5c66;
  --muted: #8a8c96;
  --line: #ececf1;
  --accent: #4b49ec;
  --accent-2: #6361f0;
  --radius-lg: 32px;
  --shadow-card: 0 24px 60px -20px rgba(75, 73, 236, 0.22);
  --sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --maxw: 1152px;
}

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }

/* ---------- Layout ---------- */
.container { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
.center { text-align: center; }

/* ---------- Typographie ---------- */
h1 { letter-spacing: -0.02em; font-weight: 800; line-height: 1.08; color: var(--ink); }
.h1 { font-size: clamp(2.5rem, 5.2vw, 4rem); line-height: 1.05; }
.lead { font-size: clamp(1.05rem, 1.6vw, 1.25rem); color: var(--body2); line-height: 1.7; }

.accent {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  color: var(--accent);
  font-size: 1.06em;
  line-height: 0.9;
  letter-spacing: 0;
  display: inline-block;
  vertical-align: baseline;
}

.eyebrow {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
}

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 999px; font-weight: 600; font-size: 0.95rem;
  padding: 14px 26px; transition: background .2s ease, transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  will-change: transform;
  cursor: pointer; border: none; background: none;
}
.btn svg { width: 18px; height: 18px; }
.btn--outline { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.btn--outline:hover { border-color: rgba(75,73,236,.4); transform: translateY(-1px); }

/* ---------- Navigation ---------- */
.nav {
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 24px); max-width: var(--maxw); z-index: 50;
}
.nav__inner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; border-radius: 20px;
  background: rgba(255,255,255,.88); border: 1px solid var(--line);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 30px -12px rgba(10,10,10,.12);
}
.nav__logo { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; }
.nav__logo span { color: var(--accent); }
.nav__actions { display: flex; align-items: center; gap: 8px; }

/* ---------- Pages légales / liens retour ---------- */
.legal-back { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 600; color: var(--accent); margin-bottom: 24px; }
.legal-back svg { width: 16px; height: 16px; }

/* ---------- Page réservation ---------- */
.booking { padding: 130px 0 96px; }
.booking__frame { max-width: 760px; margin: 24px auto 0; border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; background: #fff; box-shadow: var(--shadow-card); min-height: 700px; }

/* ---------- Accessibilité : mouvement réduit ---------- */
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
</style>
